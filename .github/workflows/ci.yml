name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "feat/**"]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin npm with the fixed dependency resolver
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format changed landing page files
        run: npx prettier --write src/routes/index.tsx src/routes/__root.tsx

      - name: Commit formatting when needed
        env:
          GH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/__root.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format Negocio em Ordem landing page"
            git push origin "HEAD:${GH_BRANCH}"
          fi

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test -- --passWithNoTests

      - name: Production build
        run: npm run build
